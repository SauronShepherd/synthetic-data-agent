bundle:
  name: synthetic-data-agent
  databricks_cli_version: ">= 0.250.0"

include:
  - bundle/resources.yml
  - bundle/targets/*.yml

artifacts:
  default:
    type: whl
    build: python -m pip wheel --no-deps --no-build-isolation -w dist .
    path: .

variables:
  catalog_name:
    description: Unity Catalog catalog used by the bootstrap workflow.
    default: sda_dev
  source_schema_name:
    description: Source schema inspected by the bootstrap workflow.
    default: sample_source
  output_schema_name:
    description: Output schema reserved for future synthetic assets.
    default: sandbox
  auto_create_uc_objects:
    description: Create the bootstrap catalog, schemas, and sample source table automatically when the run identity has privileges.
    default: "true"
  seed_sample_data:
    description: Create a tiny sample source table for the first discovery run.
    default: "true"
  allow_catalog_fallback:
    description: In dev, fall back to the first visible catalog/schema if automatic creation is not permitted.
    default: "true"
  developer_group_name:
    description: Group that can manage development bundle resources.
    default: users
  platform_admin_group_name:
    description: Group that can manage staging and production bundle resources.
    default: __REQUIRED_PLATFORM_ADMIN_GROUP__
  operator_group_name:
    description: Group allowed to run controlled staging and production workflows.
    default: __REQUIRED_OPERATOR_GROUP__
  observer_group_name:
    description: Group allowed to view controlled staging and production workflows.
    default: __REQUIRED_OBSERVER_GROUP__
  runtime_service_principal_name:
    description: Service principal application ID used as the staging/prod run identity.
    default: __REQUIRED_SERVICE_PRINCIPAL__
  sda_catalog_allowlist:
    description: Comma-separated Unity Catalog catalogs to inspect for Article 04 metadata discovery.
    default: sda_dev
  sda_schema_allowlist:
    description: Comma-separated schemas to inspect. Leave empty for all visible schemas in allowed catalogs.
    default: sample_source
  sda_table_patterns:
    description: Comma-separated table name patterns to include. Leave empty for all tables.
    default: ""
  sda_max_metadata_objects:
    description: Maximum number of metadata objects to return from uc_metadata_reader.
    default: "100"
  sda_profile_source_table:
    description: Single fully qualified relation profiled by the SDA 05 job.
    default: main.sample_source.sample_table
  sda_profile_mode:
    description: SDA 05 profiling mode.
    default: quick
  sda_profile_catalog:
    description: Governed catalog for SDA 05 profile evidence.
    default: sda_dev
  sda_profile_schema:
    description: Governed schema for SDA 05 profile evidence.
    default: profiles
  sda_allow_best_effort_snapshot:
    description: Permit non-reproducible profiling when Delta history cannot provide a source version.
    default: "true"
  sda_allow_profile_schema_create:
    description: Permit the profiler to create its output schema automatically.
    default: "true"
  sda_metadata_inventory_table:
    description: Delta table containing canonical metadata inventory payloads.
    default: sda_dev.profiles.metadata_inventory
  sda_scope_catalog:
    description: Catalog used by the scope workflow.
    default: sda_dev
  sda_scope_schema:
    description: Schema used by the scope workflow.
    default: sample_source
  sda_scope_tables:
    description: Comma-separated tables used by the scope workflow.
    default: __REQUIRED_CONTROLLED_SCOPE_TABLES__
  sda_relationship_parent_table:
    description: Parent relation for the explicit relationship job.
    default: main.sample_source.sample_customers
  sda_relationship_child_table:
    description: Child relation for the explicit relationship job.
    default: main.sample_source.sample_customers
  sda_relationship_output_table:
    description: Delta table for relationship evidence.
    default: sda_dev.profiles.relationship_analysis_scope
  sda_graph_output_table:
    description: Delta table for dependency graph evidence.
    default: sda_dev.profiles.dependency_graph_scope
