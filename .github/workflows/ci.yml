name: SDA CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,spark]" jsonschema
      - name: Compile
        run: python -m compileall -q src tests notebooks
      - name: Release hygiene
        run: python scripts/check_release.py
      - name: State schema contract
        run: python scripts/check_state_schema.py
      - name: Format check
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src
      - name: Tests and coverage
        run: python -m pytest -q -m "not spark" --tb=short --junitxml=test-results.xml --cov=src/sda --cov-report=term-missing
      - name: Local release smoke scenarios
        run: python scripts/smoke_local.py
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-results.xml
      - name: Spark tests
        run: python -m pytest -q -m spark --tb=short
      - name: Build wheel
        run: python -m build --sdist --wheel
      - name: Inspect source archive
        shell: bash
        run: |
          archive=$(ls dist/*.tar.gz)
          mkdir -p .release-check
          tar -xzf "$archive" -C .release-check
          python scripts/check_release.py .release-check

  bundle-validate:
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABRICKS_HOST: https://dbc-62483078-323e.cloud.databricks.com
      DATABRICKS_TOKEN: ${{ secrets.SDA_DATABRICKS_TOKEN || secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: databricks/setup-cli@main
      - name: Configure Databricks authentication
        run: |
          test -n "$DATABRICKS_HOST"
          test -n "$DATABRICKS_TOKEN"
          cat > "$HOME/.databrickscfg" <<EOF
          [sda-sdg]
          host = $DATABRICKS_HOST
          token = $DATABRICKS_TOKEN
          EOF
      - name: Validate bundle syntax
        run: |
          python scripts/check_bundle_contract.py
      - name: Verify controlled-target preflight rejects missing identities
        run: |
          if python scripts/preflight_bundle.py --target staging; then exit 1; fi
      - name: Validate deployment targets
        run: |
          python scripts/validate_bundle_config.py --target staging
          python scripts/validate_bundle_config.py --target prod

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[postgres,dev]"
      - name: Apply state schema
        env:
          SDA_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/sda_test
        run: python scripts/apply_state_schema.py "$SDA_POSTGRES_DSN"
      - name: Run PostgreSQL integration tests
        env:
          SDA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/sda_test
        run: python -m pytest -q -m integration
