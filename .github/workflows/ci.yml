name: SDA CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,spark]" jsonschema
      - name: Compile
        run: python -m compileall -q src tests notebooks
      - name: Release hygiene
        run: python scripts/check_release.py
      - name: Format check
        run: ruff format --check src tests
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Tests and coverage
        run: pytest -q -m "not spark" --cov=src/sda --cov-report=term-missing
      - name: Spark tests
        run: pytest -q -m spark
      - name: Build wheel
        run: python -m build --sdist --wheel
      - name: Inspect source archive
        shell: bash
        run: |
          archive=$(ls dist/*.tar.gz)
          mkdir -p .release-check
          tar -xzf "$archive" -C .release-check
          python scripts/check_release.py .release-check

  bundle-validate:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle syntax
        run: |
          python scripts/preflight_bundle.py --target dev
          databricks bundle validate -t staging
          databricks bundle validate -t prod
      - name: Verify controlled-target preflight rejects missing identities
        run: |
          if python scripts/preflight_bundle.py --target staging; then exit 1; fi
