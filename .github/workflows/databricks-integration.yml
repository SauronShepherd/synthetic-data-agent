name: SDA Databricks Integration
# Triggered after repository Databricks credentials were refreshed (retry).

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sda07-integration

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and quality dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run tests with coverage
        run: python -m pytest --cov=src/sda --cov-report=term-missing
      - name: Run Ruff
        run: ruff check src tests
      - name: Run mypy
        run: mypy src
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation -w dist .
      - name: Check release hygiene
        run: rm -rf dist build && python scripts/check_release.py

  dev-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: databricks/setup-cli@main
      - name: Configure Databricks profile
        shell: bash
        env:
          DATABRICKS_HOST: https://dbc-62483078-323e.cloud.databricks.com
          DATABRICKS_TOKEN: ${{ secrets.SDA_DATABRICKS_TOKEN || secrets.DATABRICKS_TOKEN }}
        run: |
          test -n "$DATABRICKS_HOST"
          test -n "$DATABRICKS_TOKEN"
          mkdir -p "$HOME/.databricks"
          cat > "$HOME/.databrickscfg" <<EOF
          [sda-sdg]
          host = $DATABRICKS_HOST
          token = $DATABRICKS_TOKEN
          EOF
      - name: Validate and deploy dev bundle
        run: |
          databricks bundle validate -t dev --profile sda-sdg
          databricks bundle deploy -t dev --profile sda-sdg
      - name: Run metadata, profiler, relationship, and scope smoke jobs
        shell: bash
        run: |
          set -euo pipefail
          fixture_suffix="sda07_ci_${GITHUB_RUN_ID}"
          fixture_schema="sda_integration"
          fixture_customers="workspace.${fixture_schema}.sda07_${fixture_suffix}_customers"
          fixture_orders="workspace.${fixture_schema}.sda07_${fixture_suffix}_orders"
          databricks bundle run uc_fixture -t dev --profile sda-sdg --params="catalog=workspace,schema=${fixture_schema},suffix=${fixture_suffix},mode=create"

          databricks bundle run uc_metadata_reader -t dev --profile sda-sdg --params="catalog_allowlist=workspace,schema_allowlist=${fixture_schema},table_patterns=sda07_${fixture_suffix}_*" 2>&1 | tee /tmp/sda-metadata.log
          databricks bundle run table_profiler -t dev --profile sda-sdg --params="source_table=${fixture_orders}" 2>&1 | tee /tmp/sda-profile.log
          databricks bundle run relationship_detector -t dev --profile sda-sdg --params="parent_table=${fixture_customers},child_table=${fixture_orders},parent_columns=customer_id,child_columns=customer_id,dry_run=false" 2>&1 | tee /tmp/sda-relationship.log
          databricks bundle run analyze_scope -t dev --profile sda-sdg --params="catalog=workspace,schema=${fixture_schema},tables=sda07_${fixture_suffix}_customers,sda07_${fixture_suffix}_orders,parent_table=${fixture_customers},child_table=${fixture_orders},parent_columns=customer_id,child_columns=customer_id,dry_run=false" 2>&1 | tee /tmp/sda-scope.log

          metadata_id="$(grep -oE 'metadata_inventory_[a-f0-9]{64}' /tmp/sda-metadata.log | tail -1)"
          profile_id="$(grep -oE 'profile_id[^a-f0-9]*[a-f0-9]{64}' /tmp/sda-profile.log | grep -oE '[a-f0-9]{64}' | tail -1)"
          relationship_id="$(grep -oE 'relationship_analysis_[a-f0-9]{64}' /tmp/sda-scope.log | tail -1)"
          graph_id="$(grep -oE 'dependency_graph_[a-f0-9]{64}' /tmp/sda-scope.log | tail -1)"
          test -n "$metadata_id" && test -n "$profile_id" && test -n "$relationship_id" && test -n "$graph_id"
          {
            echo "metadata_id=$metadata_id"
            echo "profile_id=$profile_id"
            echo "relationship_id=$relationship_id"
            echo "graph_id=$graph_id"
          } >> "$GITHUB_ENV"
      - name: Run pattern detector smoke job
        run: |
          databricks bundle run pattern_detector -t dev --profile sda-sdg -- \
            --metadata-artifact-id "$metadata_id" \
            --profile-artifact-ids-json "[\"$profile_id\"]" \
            --relationship-artifact-id "$relationship_id" \
            --dependency-graph-artifact-id "$graph_id" \
            --source-table "workspace.sda_integration.sda07_ci_${GITHUB_RUN_ID}_orders" \
            2>&1 | tee /tmp/sda-pattern.log
          grep -q '"pattern_count": [1-9]' /tmp/sda-pattern.log
          grep -q '"family_counts"' /tmp/sda-pattern.log
      - name: Run Spark metric contract smoke job
        run: |
          databricks bundle run spark_contract_smoke -t dev --profile sda-sdg 2>&1 | tee /tmp/sda-spark-contract.log
          grep -q 'SDA07_SPARK_CONTRACT_OK' /tmp/sda-spark-contract.log
      - name: Cleanup managed UC fixture
        if: always()
        run: |
          databricks bundle run uc_fixture -t dev --profile sda-sdg \
            --params="catalog=workspace,schema=sda_integration,suffix=sda07_ci_${GITHUB_RUN_ID},mode=cleanup" \
            >/tmp/sda-fixture-cleanup.log 2>&1 || true
