[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-data-agent"
version = "0.7.0.dev0"
description = "SDA 06 governed metadata, profiling, and relationship evidence for Databricks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ángel Álvarez Pascua" }]
dependencies = []

[project.optional-dependencies]
databricks = [
  "databricks-sql-connector>=3,<5",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "jsonschema>=4,<5",
]
spark = [
  "pyspark>=3.5,<4",
]

[project.scripts]
sda = "sda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: fast local tests",
  "spark: tests requiring PySpark",
  "databricks: tests requiring a Databricks workspace",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sda"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
strict = true
files = ["src", "tests"]
follow_imports = "skip"
