targets:
  dev:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: ${var.developer_group_name}
        level: CAN_MANAGE
    variables:
      sda_catalog_allowlist: samples
      sda_schema_allowlist: ""
      sda_table_patterns: ""
      sda_max_metadata_objects: "100"
      sda_profile_source_table: samples.bakehouse.sales_transactions
      sda_scope_catalog: samples
      sda_scope_schema: bakehouse
      sda_scope_tables: sales_franchises,sales_transactions
      sda_relationship_parent_table: samples.bakehouse.sales_franchises
      sda_relationship_child_table: samples.bakehouse.sales_transactions
      sda_relationship_output_table: sda_dev.profiles.relationship_analysis_scope
      sda_graph_output_table: sda_dev.profiles.dependency_graph_scope
      sda_metadata_inventory_table: sda_dev.profiles.metadata_inventory
      sda_manifest_table: sda_dev.profiles.run_manifests
      sda_artifact_registry_table: sda_dev.profiles.artifact_registry
