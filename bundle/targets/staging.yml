targets:
  staging:
    mode: production
    workspace:
      root_path: /Workspace/Production/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.runtime_service_principal_name}
    permissions:
      - group_name: ${var.platform_admin_group_name}
        level: CAN_MANAGE
      - group_name: ${var.operator_group_name}
        level: CAN_RUN
      - group_name: ${var.observer_group_name}
        level: CAN_VIEW
    variables:
      sda_profile_catalog: sda_staging
      sda_profile_schema: profiles
      sda_metadata_inventory_table: sda_staging.profiles.metadata_inventory
      sda_scope_catalog: sda_staging
      sda_scope_schema: sample_source
      sda_relationship_parent_table: sda_staging.sample_source.sample_customers
      sda_relationship_child_table: sda_staging.sample_source.sample_customers
      sda_relationship_output_table: sda_staging.profiles.relationship_analysis_scope
      sda_graph_output_table: sda_staging.profiles.dependency_graph_scope
      catalog_name: sda_staging
      sda_allow_best_effort_snapshot: "false"
      sda_allow_profile_schema_create: "false"
      sda_profile_source_table: sda_staging.sample_source.sample_table
      sda_catalog_allowlist: sda_staging
      sda_schema_allowlist: ""
      sda_table_patterns: ""
      sda_max_metadata_objects: "100"
