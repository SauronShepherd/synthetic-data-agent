targets:
  prod:
    mode: production
    run_as:
      service_principal_name: ${var.runtime_service_principal_name}
    workspace:
      root_path: /Workspace/Production/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: ${var.platform_admin_group_name}
        level: CAN_MANAGE
      - group_name: ${var.operator_group_name}
        level: CAN_RUN
      - group_name: ${var.observer_group_name}
        level: CAN_VIEW
    variables:
      sda_profile_catalog: sda_prod
      sda_profile_schema: profiles
      catalog_name: sda_prod
      sda_allow_best_effort_snapshot: "false"
      sda_allow_profile_schema_create: "false"
      sda_catalog_allowlist: main
      sda_schema_allowlist: ""
      sda_table_patterns: ""
      sda_max_metadata_objects: "100"
