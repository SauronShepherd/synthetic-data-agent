              - --target-schema
              - "{{job.parameters.target_schema}}"
              - --tables
              - "{{job.parameters.tables}}"
              - --columns-json
              - "{{job.parameters.columns_json}}"
              - --row-count
              - "{{job.parameters.row_count}}"
              - --max-rows
              - "{{job.parameters.max_rows}}"
              - --intended-use
              - "{{job.parameters.intended_use}}"
              - --privacy-policy-ref
              - "{{job.parameters.privacy_policy_ref}}"
              - --seed
              - "{{job.parameters.seed}}"
              - --approved
              - "{{job.parameters.approved}}"
