resources:
  jobs:
    uc_metadata_reader:
      name: "[${bundle.target}] SDA UC Metadata Reader"

      tasks:
        - task_key: read_uc_metadata
          spark_python_task:
            python_file: ../src/sda/job_entrypoints/metadata_read_spark.py
            parameters:
              - --catalog-allowlist
              - ${var.sda_catalog_allowlist}
              - --schema-allowlist
              - ${var.sda_schema_allowlist}
              - --table-patterns
              - ${var.sda_table_patterns}
              - --max-metadata-objects
              - ${var.sda_max_metadata_objects}
          environment_key: uc_metadata_reader_environment

      environments:
        - environment_key: uc_metadata_reader_environment
          spec:
            environment_version: "2"

    table_profiler:
      name: "[${bundle.target}] SDA Table Profiler"
      parameters:
        - name: source_table
          default: ${var.sda_profile_source_table}
        - name: mode
          default: ${var.sda_profile_mode}
        - name: column_allowlist
          default: ""
        - name: profile_catalog
          default: ${var.sda_profile_catalog}
        - name: profile_schema
          default: ${var.sda_profile_schema}
      tasks:
        - task_key: profile_table
          spark_python_task:
            python_file: ../src/sda/job_entrypoints/table_profile_spark.py
            parameters:
              - --source-table
              - "{{job.parameters.source_table}}"
              - --mode
              - "{{job.parameters.mode}}"
              - --column-allowlist
              - "{{job.parameters.column_allowlist}}"
              - --profile-catalog
              - "{{job.parameters.profile_catalog}}"
              - --profile-schema
              - "{{job.parameters.profile_schema}}"
          environment_key: table_profiler_environment
      environments:
        - environment_key: table_profiler_environment
          spec:
            environment_version: "2"
