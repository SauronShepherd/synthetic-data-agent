        - name: schema
          default: ${var.sda_scope_schema}
        - name: tables
          default: ${var.sda_scope_tables}
        - name: run_id
          default: ""
        - name: dry_run
          default: "false"
        - name: profile
          default: "true"
        - name: parent_table
          default: ""
        - name: child_table
          default: ""
        - name: parent_columns
          default: ""
        - name: child_columns
          default: ""
        - name: profile_catalog
          default: ${var.sda_profile_catalog}
        - name: profile_schema
