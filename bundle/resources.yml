    validate_generated:
      name: "[${bundle.target}] SDA Validate Generated Data"
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tags:
        workload: sda
        stage: validation
      parameters:
        - name: input_table
          default: ${var.output_schema_name}.generated_data
        - name: report_table
          default: ${var.catalog_name}.profiles.validation_reports
        - name: run_id
          default: ""
        - name: expected_count
          default: "0"
        - name: required_columns
          default: ""
        - name: intended_use
