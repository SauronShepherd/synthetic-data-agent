    standalone_generator:
      name: "[${bundle.target}] SDA Standalone Generator"
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tags:
        workload: sda
        stage: generation
      parameters:
        - name: output_table
          default: ${var.output_schema_name}.generated_data
        - name: run_id
          default: ""
        - name: request_id
          default: ""
        - name: plan_id
          default: ""
        - name: plan_fingerprint
          default: ""
        - name: source_snapshot_ids
          default: ""
        - name: input_artifact_ids
          default: ""
        - name: target_catalog
          default: ${var.catalog_name}
        - name: target_schema
          default: ${var.output_schema_name}
        - name: tables
          default: generated_data
        - name: columns_json
          default: "[]"
        - name: row_count
          default: "0"
        - name: max_rows
          default: "100000"
        - name: intended_use
          default: qa
        - name: privacy_policy_ref
          default: strict-default
        - name: seed
          default: "1729"
        - name: approved
          default: "false"
      tasks:
        - task_key: generate_standalone
          spark_python_task:
            python_file: ../src/sda/job_entrypoints/generate_spark.py
            parameters:
              - --output-table
              - "{{job.parameters.output_table}}"
              - --run-id
              - "{{job.parameters.run_id}}"
              - --request-id
              - "{{job.parameters.request_id}}"
              - --plan-id
