resources:
  jobs:
    uc_fixture:
      name: "[${bundle.target}] SDA UC Integration Fixture"
      max_concurrent_runs: 1
      timeout_seconds: 1800
      tags:
        workload: sda
        stage: integration-fixture
      parameters:
        - name: catalog
          default: workspace
        - name: schema
          default: sda_integration
        - name: suffix
          default: ci
        - name: mode
          default: create
      tasks:
        - task_key: fixture
          spark_python_task:
            python_file: ../src/sda/job_entrypoints/uc_fixture_spark.py
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
              - --schema
              - "{{job.parameters.schema}}"
              - --suffix
              - "{{job.parameters.suffix}}"
              - --mode
              - "{{job.parameters.mode}}"
          environment_key: uc_fixture_environment
      environments:
        - environment_key: uc_fixture_environment
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
    spark_contract_smoke:
      name: "[${bundle.target}] SDA Spark Contract Smoke"
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tags:
        workload: sda
        stage: verification
      parameters:
        - name: source_table
          default: ${var.sda_profile_source_table}
        - name: parent_table
          default: ${var.sda_relationship_parent_table}
        - name: child_table
          default: ${var.sda_relationship_child_table}
        - name: parent_key
          default: id
        - name: child_key
          default: customer_id
        - name: segment
          default: segment
      tasks:
        - task_key: spark_contract_smoke
          spark_python_task:
            python_file: ../src/sda/job_entrypoints/spark_contract_smoke.py
            parameters:
              - --source-table
              - "{{job.parameters.source_table}}"
              - --parent-table
              - "{{job.parameters.parent_table}}"
              - --child-table
              - "{{job.parameters.child_table}}"
              - --parent-key
              - "{{job.parameters.parent_key}}"
              - --child-key
              - "{{job.parameters.child_key}}"
              - --segment
              - "{{job.parameters.segment}}"
          environment_key: spark_contract_smoke_environment
      environments:
        - environment_key: spark_contract_smoke_environment
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

    uc_metadata_reader:
      name: "[${bundle.target}] SDA UC Metadata Reader"
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tags:
        workload: sda
        stage: metadata
      parameters:
        - name: run_id
          default: ""
        - name: environment
          default: ${bundle.target}
        - name: catalog_allowlist
          default: ${var.sda_catalog_allowlist}
        - name: schema_allowlist
          default: ${var.sda_schema_allowlist}
        - name: table_patterns
          default: ${var.sda_table_patterns}
        - name: max_metadata_objects
          default: ${var.sda_max_metadata_objects}
        - name: output_table
          default: ${var.sda_metadata_inventory_table}
        - name: artifact_registry_table
          default: ${var.sda_artifact_registry_table}

      tasks:
        - task_key: bootstrap_artifact_tables
          spark_python_task:
            python_file: ../src/sda/job_entrypoints/bootstrap_artifacts_spark.py
            parameters:
              - --metadata-table
              - "{{job.parameters.output_table}}"
              - --registry-table
              - "{{job.parameters.artifact_registry_table}}"
          environment_key: uc_metadata_reader_environment
        - task_key: read_uc_metadata
          depends_on:
            - task_key: bootstrap_artifact_tables
          spark_python_task:
            python_file: ../src/sda/job_entrypoints/metadata_read_spark.py
            parameters:
              - --run-id
              - "{{job.parameters.run_id}}"
              - --environment
              - "{{job.parameters.environment}}"
              - --catalog-allowlist
              - "{{job.parameters.catalog_allowlist}}"
              - --schema-allowlist
              - "{{job.parameters.schema_allowlist}}"
              - --table-patterns
              - "{{job.parameters.table_patterns}}"
              - --max-metadata-objects
              - "{{job.parameters.max_metadata_objects}}"
              - --output-table
              - "{{job.parameters.output_table}}"
              - --artifact-registry-table
              - "{{job.parameters.artifact_registry_table}}"
          environment_key: uc_metadata_reader_environment

      environments:
        - environment_key: uc_metadata_reader_environment
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

