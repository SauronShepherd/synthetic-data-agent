resources:
  jobs:
    uc_metadata_reader:
      name: "[${bundle.target}] SDA UC Metadata Reader"
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tags:
        workload: sda
        stage: metadata
      parameters:
        - name: run_id
          default: ""
        - name: environment
          default: ${bundle.target}
        - name: catalog_allowlist
          default: ${var.sda_catalog_allowlist}
        - name: schema_allowlist
          default: ${var.sda_schema_allowlist}
        - name: table_patterns
          default: ${var.sda_table_patterns}
        - name: max_metadata_objects
          default: ${var.sda_max_metadata_objects}
        - name: output_table
          default: ${var.sda_metadata_inventory_table}
        - name: artifact_registry_table
          default: ${var.sda_artifact_registry_table}

      tasks:
        - task_key: bootstrap_artifact_tables
          spark_python_task:
            python_file: ../src/sda/job_entrypoints/bootstrap_artifacts_spark.py
            parameters:
              - --metadata-table
              - "{{job.parameters.output_table}}"
              - --registry-table
              - "{{job.parameters.artifact_registry_table}}"
          environment_key: uc_metadata_reader_environment
        - task_key: read_uc_metadata
          depends_on:
            - task_key: bootstrap_artifact_tables
          spark_python_task:
            python_file: ../src/sda/job_entrypoints/metadata_read_spark.py
            parameters:
              - --run-id
              - "{{job.parameters.run_id}}"
              - --environment
              - "{{job.parameters.environment}}"
              - --catalog-allowlist
              - "{{job.parameters.catalog_allowlist}}"
              - --schema-allowlist
              - "{{job.parameters.schema_allowlist}}"
              - --table-patterns
              - "{{job.parameters.table_patterns}}"
              - --max-metadata-objects
              - "{{job.parameters.max_metadata_objects}}"
              - --output-table
              - "{{job.parameters.output_table}}"
              - --artifact-registry-table
              - "{{job.parameters.artifact_registry_table}}"
          environment_key: uc_metadata_reader_environment

      environments:
        - environment_key: uc_metadata_reader_environment
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

    table_profiler:
      name: "[${bundle.target}] SDA Table Profiler"
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tags:
        workload: sda
        stage: profiling
      parameters:
        - name: source_table
          default: ${var.sda_profile_source_table}
        - name: mode
          default: ${var.sda_profile_mode}
        - name: column_allowlist
          default: ""
        - name: column_denylist
          default: ""
        - name: sample_fraction
          default: "0.1"
        - name: sample_seed
          default: "42"
        - name: stable_key_column
          default: ""
        - name: max_category_values
          default: "100"
        - name: percentile_accuracy
          default: "10000"
        - name: business_event_column
          default: ""
        - name: conditional_null_segments
          default: ""
        - name: outlier_methods
          default: "iqr,percentile"
        - name: value_retention_policy
          default: redact_values
        - name: sensitive_value_retention_policy
          default: no_values
        - name: reuse_existing
          default: "true"
        - name: allow_best_effort_snapshot
          default: ${var.sda_allow_best_effort_snapshot}
        - name: allow_profile_schema_create
          default: ${var.sda_allow_profile_schema_create}
        - name: allow_metadata_fallback
          default: "false"
        - name: profile_catalog
          default: ${var.sda_profile_catalog}
        - name: profile_schema
          default: ${var.sda_profile_schema}
        - name: metadata_inventory_id
          default: ""
        - name: metadata_inventory_table
          default: ""
        - name: artifact_registry_table
          default: ${var.sda_artifact_registry_table}
        - name: run_id
          default: ""
        - name: environment
          default: ${bundle.target}
      tasks:
        - task_key: profile_table
          spark_python_task:
            python_file: ../src/sda/job_entrypoints/table_profile_spark.py
            parameters:
              - --source-table
              - "{{job.parameters.source_table}}"
              - --mode
              - "{{job.parameters.mode}}"
              - --column-allowlist
              - "{{job.parameters.column_allowlist}}"
              - --column-denylist
              - "{{job.parameters.column_denylist}}"
              - --sample-fraction
              - "{{job.parameters.sample_fraction}}"
              - --sample-seed
              - "{{job.parameters.sample_seed}}"
              - --stable-key-column
              - "{{job.parameters.stable_key_column}}"
              - --max-category-values
              - "{{job.parameters.max_category_values}}"
              - --percentile-accuracy
              - "{{job.parameters.percentile_accuracy}}"
              - --business-event-column
              - "{{job.parameters.business_event_column}}"
              - --conditional-null-segments
              - "{{job.parameters.conditional_null_segments}}"
              - --outlier-methods
              - "{{job.parameters.outlier_methods}}"
              - --value-retention-policy
              - "{{job.parameters.value_retention_policy}}"
              - --sensitive-value-retention-policy
              - "{{job.parameters.sensitive_value_retention_policy}}"
              - --reuse-existing
              - "{{job.parameters.reuse_existing}}"
              - --allow-best-effort-snapshot
              - "{{job.parameters.allow_best_effort_snapshot}}"
              - --allow-profile-schema-create
              - "{{job.parameters.allow_profile_schema_create}}"
              - --allow-metadata-fallback
              - "{{job.parameters.allow_metadata_fallback}}"
              - --profile-catalog
              - "{{job.parameters.profile_catalog}}"
              - --profile-schema
              - "{{job.parameters.profile_schema}}"
              - --metadata-inventory-id
              - "{{job.parameters.metadata_inventory_id}}"
              - --metadata-inventory-table
              - "{{job.parameters.metadata_inventory_table}}"
              - --artifact-registry-table
              - "{{job.parameters.artifact_registry_table}}"
              - --run-id
              - "{{job.parameters.run_id}}"
              - --environment
              - "{{job.parameters.environment}}"
          environment_key: table_profiler_environment
      environments:
        - environment_key: table_profiler_environment
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

    relationship_detector:
      name: "[${bundle.target}] SDA Relationship Detector"
      max_concurrent_runs: 1
      timeout_seconds: 7200
      tags:
        workload: sda
        stage: relationships
      tasks:
        - task_key: detect_relationships
          spark_python_task:
            python_file: ../src/sda/job_entrypoints/relationship_detect_spark.py
            parameters:
              - --parent-table
              - "{{job.parameters.parent_table}}"
              - --child-table
              - "{{job.parameters.child_table}}"
              - --parent-columns
              - "{{job.parameters.parent_columns}}"
              - --child-columns
              - "{{job.parameters.child_columns}}"
              - --output-table
              - "{{job.parameters.output_table}}"
              - --run-id
              - "{{job.parameters.run_id}}"
              - --environment
              - "${bundle.target}"
              - --dry-run
              - "{{job.parameters.dry_run}}"
          environment_key: relationship_detector_environment
      parameters:
        - name: parent_table
          default: ${var.sda_relationship_parent_table}
        - name: child_table
          default: ${var.sda_relationship_child_table}
        - name: parent_columns
          default: franchiseID
        - name: child_columns
          default: franchiseID
        - name: output_table
          default: ${var.sda_relationship_output_table}
        - name: artifact_registry_table
          default: ${var.sda_artifact_registry_table}
        - name: run_id
